<body>
    <header>
        <p class="logo">Tasty Bites</p>

        <nav class="nav_bar">
            <a href="index.html" class="nav-link">Home</a>
            <a href="recipes.html" class="nav-link">Recipes</a>
            <a href="send-recipe.html" class="nav-link active">Send Your Recipe</a>
        </nav>

        <button type="button" id="menu" aria-label="Menu"></button>

    </header>

    <main>
        <section class="recipes">
            <h1>Send Your Recipe</h1>

            <form action="thankyou.html" method="get" autocomplete="on">
                <p class="form-titles">Personal information:</p>
                <label title="Enter your first name">First Name:
                    <input type="text" name="firstName" required title="Requires at least 7 alpha, hyphens, and spaces only." autocomplete="given-name">
                </label>
                <label title="Enter your last name">Last Name:
                    <input type="text" name="lastName" required title="Last Name" autocomplete="family-name">
                </label>
               
                <label title="Enter your email">Email:
                    <input type="email" name="email" required title="Email Address" autocomplete="email"
                        placeholder="you@example.com">
                </label>
               
                <p class="form-titles">Recipe Information:</p>

                <label title="Name">Name:
                    <input type="text" name="recipe_name" required>
                </label>

                <label title="Category">Category
                    <select name="recipe_category" required>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Desserts">Desserts</option> 
                    </select>
                </label>

                <label title="Cooking time">Cooking time:
                    <input type="text" name="recipe_time" required>
                </label>

                <label title="Describe your business or organization">Ingredients:
                    <textarea type="text" name="recipe_ingridients" required></textarea>
                </label>

                <label title="Describe your business or organization">Steps:
                    <textarea type="text" name="recipe_steps" required></textarea>
                </label>

                <label title="Cooking time">Fun fact
                    <input type="text" name="recipe_funfact">
                </label>

                <input type="hidden" name="timestamp" id="timestamp">
                <input type="submit" class="button" value="Submit">
            </form>

           
        </section>
    </main>

    <footer>
        <p>Contact us at hello@tastybites.com</p>
        <p>&copy; 2025 Tasty Bites</p>
        <div class="social-links">
            <a target="_blank" href="https://www.loom.com/share/c1737393d06246d1a118b2aab5c911f9?sid=0ad2d529-aa8f-47e0-87f0-9650919aeb84">Demostration Video</a> | <a href="https://instagram.com">Instagram</a> |
            <a href="https://facebook.com">Facebook</a>
        </div>
    </footer>
    
    <script src="scripts/scripts.js"></script>

</body>
